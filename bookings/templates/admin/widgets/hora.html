{% comment %}
  Widget de hora em duas caixas: [hora] : [minuto]. Ambas aceitam escrita
  livre; o <datalist> só sugere valores (0-23 nas horas, 00/15/30/45 nos
  minutos) sem impedir outros.
{% endcomment %}<span class="hora-widget" style="display:inline-flex; align-items:center; gap:4px;">
  <input type="number" name="{{ widget.name }}_h" value="{{ widget.hora }}"
         min="0" max="23" placeholder="hh" inputmode="numeric"
         list="{{ widget.attrs.id }}_horas" style="width:4.5em;">
  <strong>:</strong>
  <input type="text" name="{{ widget.name }}_m" value="{{ widget.minuto }}"
         placeholder="mm" inputmode="numeric" maxlength="2"
         list="{{ widget.attrs.id }}_minutos" style="width:4.5em;">
  <datalist id="{{ widget.attrs.id }}_horas">
    {% for h in widget.horas_lista %}<option value="{{ h }}"></option>{% endfor %}
  </datalist>
  <datalist id="{{ widget.attrs.id }}_minutos">
    <option value="00"></option><option value="15"></option>
    <option value="30"></option><option value="45"></option>
  </datalist>
</span>
