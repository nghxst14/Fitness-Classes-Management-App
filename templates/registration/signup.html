{% extends "base_auth.html" %}

{% block title %}Criar conta — RESTART NOW{% endblock %}

{% block content %}
  <h1>Criar conta</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Criar conta</button>
  </form>

  <div class="auth-links">
    <p>Já tens conta? <a href="{% url 'login' %}">Entra aqui</a>.</p>
  </div>
{% endblock %}
