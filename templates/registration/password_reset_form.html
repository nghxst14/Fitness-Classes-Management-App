{% extends "base.html" %}

{% block title %}Recuperar password — Gestão de Treinos{% endblock %}

{% block content %}
  <div class="form-card">
    <h1>Recuperar password</h1>
    <p class="muted">
      Escreve o email da tua conta. Enviamos-te um link para definires
      uma nova password.
    </p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn">Enviar link</button>
    </form>
    <p class="muted"><a href="{% url 'login' %}">← Voltar a entrar</a></p>
  </div>
{% endblock %}
